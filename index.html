/* ============================== 2. UTILITAS ============================== */

function cn(...xs: (string | false | null | undefined)[]): string { return xs.filter(Boolean).join(' '); }
function uid(p = 'id'): string { return p + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function pad2(n: number): string { return String(n).padStart(2, '0'); }
function todayISO(): string { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; }
function nowLocal(): string { const d = new Date(); return `${todayISO()}T${pad2(d.getHours())}:${pad2(d.getMinutes())}`; }

function fmtDate(iso?: string): string {
  if (!iso) return '-';
  const [y, m, d] = iso.split('-').map(Number);
  if (!y || !m || !d) return iso;
  return `${d} ${BULAN[m - 1]} ${y}`;
}
function fmtDateTime(s?: string): string {
  if (!s) return '-';
  const [d, t] = s.split('T');
  return `${fmtDate(d)}${t ? ', ' + t.replace(':', '.') : ''}`;
}
function fmtBytes(n: number): string {
  if (!n && n !== 0) return '-';
  if (n < 1024) return n + ' B';
  const u = ['KB', 'MB', 'GB']; let i = -1;
  do { n /= 1024; i++; } while (n >= 1024 && i < 2);
  return n.toFixed(n < 10 ? 1 : 0).replace('.', ',') + ' ' + u[i];
}
function initials(nama: string): string {
  return (nama || '?').split(' ').filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();
}
function exportCsv(filename: string, headers: string[], rows: (string | number)[][]): void {
  const esc = (v: string | number) => `"${String(v).replace(/"/g, '""')}"`;
  const csv = [headers.map(esc).join(';'), ...rows.map(r => r.map(esc).join(';'))].join('\r\n');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 800);
}
function nextKodeBB(barang: BarangBukti[]): string {
  let max = 0;
  barang.forEach(b => { const m = b.kode.match(/^BB-\d{4}-(\d+)$/); if (m) max = Math.max(max, parseInt(m[1], 10)); });
  return `BB-${new Date().getFullYear()}-${pad2(max + 1).padStart(4, '0')}`;
}

function loadStore(): StoreData {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const d = JSON.parse(raw);
      if (d && Array.isArray(d.perkara) && Array.isArray(d.barang) && Array.isArray(d.riwayat) && Array.isArray(d.users)) return d;
    }
  } catch (e) { /* abaikan, gunakan seed */ }
  const s = seedStore();
  saveStore(s);
  return s;
}
function saveStore(d: StoreData): void {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(d)); } catch (e) { /* kuota penuh — abaikan pada demo */ }
}

type ToastType = 'success' | 'error' | 'info';
interface Toast { id: string; type: ToastType; title: string; message?: string; }

const AppCtx = createContext<any>(null);
function useApp(): any { return useContext(AppCtx); }

function loadSession(): UserAkun | null {
  try {
    const raw = localStorage.getItem(SESSION_KEY) || sessionStorage.getItem(SESSION_KEY);
    if (!raw) return null;
    const s = JSON.parse(raw);
    const data = loadStore();
    return data.users.find((u: UserAkun) => u.username === s.username && u.status === 'Aktif') || null;
  } catch (e) { return null; }
}

function AppProvider({ children }: { children: React.ReactNode }) {
  const [data, setData] = useState<StoreData>(loadStore);
  const [user, setUser] = useState<UserAkun | null>(loadSession);
  const [toasts, setToasts] = useState<Toast[]>([]);

  useEffect(() => { saveStore(data); }, [data]);
  useEffect(() => { const b = document.getElementById('boot'); if (b) b.remove(); }, []);

  const dismissToast = useCallback((id: string) => setToasts(t => t.filter(x => x.id !== id)), []);
  const toast = useCallback((type: ToastType, title: string, message?: string) => {
    const id = uid('t');
    setToasts(t => [...t.slice(-3), { id, type, title, message }]);
    window.setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 4500);
  }, []);

  /* ---- autentikasi (demo) ---- */
  function login(username: string, password: string, remember: boolean): { ok: boolean; msg?: string; nama?: string } {
    const u = data.users.find((x: UserAkun) => x.username.toLowerCase() === username.trim().toLowerCase());
    if (!u) return { ok: false, msg: 'Nama pengguna tidak terdaftar pada data demo.' };
    if (u.status !== 'Aktif') return { ok: false, msg: 'Akun ini berstatus nonaktif. Hubungi administrator.' };
    if (password !== 'demo123') return { ok: false, msg: 'Kata sandi salah. Untuk demo, gunakan kata sandi: demo123' };
    const nu = { ...u, aktivitasTerakhir: nowLocal() };
    setData(d => ({ ...d, users: d.users.map((x: UserAkun) => (x.id === u.id ? nu : x)) }));
    const sess = JSON.stringify({ username: u.username });
    (remember ? localStorage : sessionStorage).setItem(SESSION_KEY, sess);
    (remember ? sessionStorage : localStorage).removeItem(SESSION_KEY);
    setUser(nu);
    return { ok: true, nama: nu.nama };
  }
  function logout(): void {
    localStorage.removeItem(SESSION_KEY);
    sessionStorage.removeItem(SESSION_KEY);
    setUser(null);
  }

  /* ---- CRUD perkara ---- */
  function addPerkara(p: any): Perkara {
    const np: Perkara = { ...p, nomorLP: p.nomorLP.trim(), id: uid('pk'), createdAt: nowLocal() };
    setData(d => ({ ...d, perkara: [...d.perkara, np] }));
    return np;
  }
  function updatePerkara(id: string, p: any): void {
    setData(d => ({ ...d, perkara: d.perkara.map((x: Perkara) => (x.id === id ? { ...x, ...p, nomorLP: p.nomorLP.trim() } : x)) }));
  }
  function deletePerkara(id: string): { ok: boolean; msg?: string } {
    const p = data.perkara.find((x: Perkara) => x.id === id);
    if (!p) return { ok: false, msg: 'Perkara tidak ditemukan.' };
    const linked = data.barang.filter((b: BarangBukti) => b.nomorLP === p.nomorLP).length;
    if (linked > 0) return { ok: false, msg: `Tidak dapat dihapus: masih terdapat ${linked} barang bukti terkait LP ini.` };
    setData(d => ({ ...d, perkara: d.perkara.filter((x: Perkara) => x.id !== id) }));
    return { ok: true };
  }

  /* ---- CRUD barang bukti ---- */
  function penerimaanEvent(nb: BarangBukti, alasan: string): Riwayat {
    return {
      id: uid('rv'), kodeBB: nb.kode, jenis: 'Penerimaan',
      tanggalWaktu: (nb.tanggalPenerimaan || nowLocal().slice(0, 10)) + 'T09:00',
      lokasiAsal: 'Penyerahan Penyidik', lokasiTujuan: nb.lokasi, petugas: nb.petugasPenerima,
      alasan, catatan: nb.catatan || '', harapanKembali: '', statusKembali: '',
    };
  }
  function addBarang(p: any): BarangBukti {
    const nb: BarangBukti = { ...p, kode: p.kode.trim(), id: uid('bb'), createdAt: nowLocal() };
    setData(d => {
      const rv = [...d.riwayat];
      if (!nb.draf) rv.push(penerimaanEvent(nb, 'Penerimaan awal barang bukti'));
      return { ...d, barang: [...d.barang, nb], riwayat: rv };
    });
    return nb;
  }
  function updateBarang(id: string, p: any): void {
    setData(d => {
      const old = d.barang.find((b: BarangBukti) => b.id === id);
      if (!old) return d;
      const nb: BarangBukti = { ...old, ...p, kode: p.kode.trim(), id: old.id, createdAt: old.createdAt };
      let rv = d.riwayat;
      if (old.kode !== nb.kode) rv = rv.map((r: Riwayat) => (r.kodeBB === old.kode ? { ...r, kodeBB: nb.kode } : r));
      if (!nb.draf) {
        const now = nowLocal();
        const petugas = user ? user.nama : 'Sistem';
        if (old.draf) {
          rv = [...rv, penerimaanEvent(nb, 'Pendaftaran barang bukti dari draft')];
        } else if (old.lokasi !== nb.lokasi) {
          rv = [...rv, { id: uid('rv'), kodeBB: nb.kode, jenis: 'Perpindahan', tanggalWaktu: now, lokasiAsal: old.lokasi, lokasiTujuan: nb.lokasi, petugas, alasan: 'Penyesuaian lokasi melalui formulir edit', catatan: 'Dicatat otomatis oleh sistem (demo).', harapanKembali: '', statusKembali: '' }];
        } else if (old.status !== nb.status) {
          rv = [...rv, { id: uid('rv'), kodeBB: nb.kode, jenis: 'Pemeriksaan', tanggalWaktu: now, lokasiAsal: nb.lokasi, lokasiTujuan: nb.lokasi, petugas, alasan: 'Pembaruan status melalui formulir edit', catatan: 'Dicatat otomatis oleh sistem (demo).', harapanKembali: '', statusKembali: '' }];
        }
      }
      return { ...d, barang: d.barang.map((b: BarangBukti) => (b.id === id ? nb : b)), riwayat: rv };
    });
  }
  function deleteBarang(id: string): { ok: boolean; msg?: string } {
    const b = data.barang.find((x: BarangBukti) => x.id === id);
    if (!b) return { ok: false, msg: 'Data tidak ditemukan.' };
    setData(d => ({ ...d, barang: d.barang.filter((x: BarangBukti) => x.id !== id), riwayat: d.riwayat.filter((r: Riwayat) => r.kodeBB !== b.kode) }));
    return { ok: true };
  }

  /* ---- riwayat / chain of custody: selalu tambah kejadian baru, tidak pernah menimpa ---- */
  function addRiwayat(ev: any): void {
    setData(d => {
      const rv = [...d.riwayat, { ...ev, id: uid('rv') }];
      const barang = d.barang.map((b: BarangBukti) => {
        if (b.kode !== ev.kodeBB || b.draf) return b;
        let status = b.status, lokasi = b.lokasi;
        if (ev.jenis === 'Peminjaman') { status = 'Dipinjam'; lokasi = ev.lokasiTujuan || lokasi; }
        else if (ev.jenis === 'Pengembalian') { status = 'Tersedia'; lokasi = ev.lokasiTujuan || lokasi; }
        else if (ev.jenis === 'Perpindahan' || ev.jenis === 'Pengalihan' || ev.jenis === 'Penerimaan') { lokasi = ev.lokasiTujuan || lokasi; }
        return { ...b, status, lokasi };
      });
      if (ev.jenis === 'Pengembalian') {
        for (let i = rv.length - 1; i >= 0; i--) {
          const r = rv[i];
          if (r.kodeBB === ev.kodeBB && r.jenis === 'Peminjaman' && r.statusKembali === 'Belum Kembali') {
            rv[i] = { ...r, statusKembali: 'Sudah Kembali' };
            break;
          }
        }
      }
      return { ...d, barang, riwayat: rv };
    });
  }

  /* ---- manajemen pengguna (demo) ---- */
  function addUser(p: any): { ok: boolean; msg?: string } {
    const u = p.username.trim().toLowerCase();
    if (data.users.some((x: UserAkun) => x.username.toLowerCase() === u)) return { ok: false, msg: 'Nama pengguna sudah digunakan.' };
    const nu: UserAkun = { id: uid('usr'), username: p.username.trim(), nama: p.nama.trim(), role: p.role, status: p.status || 'Aktif', aktivitasTerakhir: '-' };
    setData(d => ({ ...d, users: [...d.users, nu] }));
    return { ok: true };
  }
  function updateUser(id: string, p: any): void {
    setData(d => ({ ...d, users: d.users.map((x: UserAkun) => (x.id === id ? { ...x, nama: p.nama.trim(), role: p.role, status: p.status } : x)) }));
  }
  function setUserStatus(id: string, status: 'Aktif' | 'Nonaktif'): void {
    setData(d => ({ ...d, users: d.users.map((x: UserAkun) => (x.id === id ? { ...x, status } : x)) }));
  }
  function deleteUser(id: string): { ok: boolean; msg?: string } {
    const u = data.users.find((x: UserAkun) => x.id === id);
    if (!u) return { ok: false, msg: 'Pengguna tidak ditemukan.' };
    if (u.username === 'admin') return { ok: false, msg: 'Akun admin demo tidak dapat dihapus.' };
    if (user && u.id === user.id) return { ok: false, msg: 'Anda tidak dapat menghapus akun yang sedang digunakan.' };
    setData(d => ({ ...d, users: d.users.filter((x: UserAkun) => x.id !== id) }));
    return { ok: true };
  }

  function resetDemo(): void {
    const s = seedStore();
    setData(s);
  }
  function setNotifSeen(): void {
    setData(d => ({ ...d, notifSeen: nowLocal() }));
  }

  const value = {
    data, user, toasts, toast, dismissToast,
    login, logout, addPerkara, updatePerkara, deletePerkara,
    addBarang, updateBarang, deleteBarang, addRiwayat,
    addUser, updateUser, setUserStatus, deleteUser, resetDemo, setNotifSeen,
  };
  return <AppCtx.Provider value={value}>{children}<Toaster /></AppCtx.Provider>;
}

/* Ikon Lucide: placeholder <i data-lucide> diganti menjadi SVG oleh lucide.createIcons()
   melalui penjadwal satu-frame agar tidak memindai DOM berulang kali. */
let lucideQueued = false;
function queueLucide(): void {
  if (lucideQueued) return;
  lucideQueued = true;
  requestAnimationFrame(() => {
    lucideQueued = false;
    try { if ((window as any).lucide) (window as any).lucide.createIcons(); } catch (e) { /* abaikan */ }
  });
}
function Icon({ name, size = 18, className = '', strokeWidth = 2 }: { name: string; size?: number; className?: string; strokeWidth?: number }) {
  const ref = useRef<HTMLSpanElement>(null);
  useLayoutEffect(() => {
    const host = ref.current;
    if (!host) return;
    host.innerHTML = '';
    const ph = document.createElement('i');
    ph.setAttribute('data-lucide', name);
    ph.setAttribute('width', String(size));
    ph.setAttribute('height', String(size));
    ph.setAttribute('stroke-width', String(strokeWidth));
    host.appendChild(ph);
    queueLucide();
  }, [name, size, strokeWidth]);
  return <span ref={ref} className={cn('inline-flex shrink-0 items-center justify-center leading-none', className)} />;
}

function buttonClass(variant = 'primary', size = 'md', className = ''): string {
  const base = 'inline-flex items-center justify-center gap-2 rounded-lg font-semibold transition focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500/40 disabled:cursor-not-allowed disabled:opacity-50';
  const sizes: Record<string, string> = { sm: 'px-2.5 py-1.5 text-xs', md: 'px-4 py-2 text-sm' };
  const variants: Record<string, string> = {
    primary: 'bg-blue-600 text-white shadow-sm hover:bg-blue-700 active:bg-blue-800',
    secondary: 'border border-slate-300 bg-white text-slate-700 shadow-sm hover:bg-slate-50 hover:text-navy-800',
    ghost: 'text-slate-600 hover:bg-slate-100 hover:text-navy-800',
    danger: 'bg-red-600 text-white shadow-sm hover:bg-red-700',
    navy: 'bg-navy-800 text-white shadow-sm hover:bg-navy-700',
  };
  return cn(base, sizes[size], variants[variant], className);
}

function Pagination({ page, pageSize, total, onPage }: { page: number; pageSize: number; total: number; onPage: (p: number) => void }) {
  const pages = Math.max(1, Math.ceil(total / pageSize));
  if (total === 0) return null;
  const from = (page - 1) * pageSize + 1;
  const to = Math.min(total, page * pageSize);
  const nums: (number | string)[] = [];
  for (let i = 1; i <= pages; i++) {
    if (i === 1 || i === pages || Math.abs(i - page) <= 1) nums.push(i);
    else if (nums[nums.length - 1] !== '…') nums.push('…');
  }
  return (
    <div className="flex flex-col items-center justify-between gap-3 border-t border-slate-100 px-5 py-3 sm:flex-row">
      <p className="text-xs text-slate-500">
        Menampilkan <span className="font-semibold tabular-nums text-slate-700">{from}–{to}</span> dari{' '}
        <span className="font-semibold tabular-nums text-slate-700">{total}</span> data
      </p>
      <div className="flex items-center gap-1">
        <IconBtn icon="chevron-left" title="Halaman sebelumnya" disabled={page <= 1} onClick={() => onPage(page - 1)} />
        {nums.map((n, i) => n === '…'
          ? <span key={'e' + i} className="px-1 text-xs text-slate-400">…</span>
          : <button key={String(n)} onClick={() => onPage(n as number)}
              className={cn('h-8 min-w-[32px] rounded-md px-2 text-xs font-semibold tabular-nums transition',
                n === page ? 'bg-blue-600 text-white shadow-sm' : 'border border-slate-200 bg-white text-slate-600 hover:bg-slate-50')}>
              {n}
            </button>)}
        <IconBtn icon="chevron-right" title="Halaman berikutnya" disabled={page >= pages} onClick={() => onPage(page + 1)} />
      </div>
    </div>
  );
}

  return (
    <ol>
      {items.map((r, i) => {
        const m = JENIS_META[r.jenis] || JENIS_META.Perpindahan;

        return (
          <li key={r.id} className="flex gap-3">

                <span className={cn('inline-flex items-center gap-1 rounded-full px-2 py-0.5 text-[11px] font-semibold ring-1 ring-inset', m.badge)}>
                  <Icon name={m.icon} size={11} />{r.jenis}

                {showKode && !bid && <span className="text-xs font-bold text-navy-800">{r.kodeBB}</span>}
                <span className="text-[11px] tabular-nums text-slate-400">{fmtDateTime(r.tanggalWaktu)}</span>
              </div>
              <p className="mt-1.5 flex flex-wrap items-center gap-1 text-xs text-slate-600">
                <span className="truncate">{r.lokasiAsal}</span>
                <Icon name="arrow-right" size={12} className="shrink-0 text-slate-400" />

        );

  );

function useHash(): string {
  const [hash, setHash] = useState<string>(() => window.location.hash || '#/');
  useEffect(() => {
    const f = () => setHash(window.location.hash || '#/');
    window.addEventListener('hashchange', f);
    return () => window.removeEventListener('hashchange', f);
  }, []);
  return hash;
}
function Redirect({ to }: { to: string }) {
  useEffect(() => { window.location.hash = to; }, [to]);
  return null;
}

function AppShell({ path }: { path: string }) {
  const { data, user } = useApp();
  const [pathRaw, qs] = path.split('?');
  const query = new URLSearchParams(qs || '');
  const seg = pathRaw.split('/').filter(Boolean);
  const [collapsed, setCollapsed] = useState(() => localStorage.getItem('se_sidebar') === '1');
  const [drawer, setDrawer] = useState(false);

  const toggleCollapsed = () => setCollapsed((c: boolean) => {
    localStorage.setItem('se_sidebar', c ? '0' : '1');
    return !c;
  });

  useEffect(() => { window.scrollTo({ top: 0 }); }, [pathRaw]);

  /* Judul & breadcrumb per rute */
  let title = 'Dashboard';
  let crumbs: { label: string; to?: string }[] = [{ label: 'Beranda', to: '/dashboard' }];
  const k = seg[0] || 'dashboard';
  if (k === 'dashboard') { title = 'Dashboard'; }
  else if (k === 'perkara') {
    title = 'Data Perkara'; crumbs.push({ label: 'Data Perkara', to: '/perkara' });
    if (seg[1]) {
      const p = data.perkara.find((x: Perkara) => x.id === seg[1]);
      title = 'Detail Perkara';
      crumbs.push({ label: p ? p.nomorLP : 'Detail Perkara' });
    }
  } else if (k === 'barang-bukti') {
    crumbs.push({ label: 'Data Barang Bukti', to: '/barang-bukti' });
    if (!seg[1]) { title = 'Data Barang Bukti'; }
    else if (seg[1] === 'baru') { title = 'Tambah Barang Bukti'; crumbs.push({ label: 'Tambah' }); }
    else {
      const b = data.barang.find((x: BarangBukti) => x.id === seg[1]);
      if (seg[2] === 'edit') { title = 'Edit Barang Bukti'; crumbs.push({ label: b ? b.kode : seg[1], to: '/barang-bukti/' + seg[1] }); crumbs.push({ label: 'Edit' }); }
      else { title = 'Detail Barang Bukti'; crumbs.push({ label: b ? b.kode : seg[1] }); }
    }
  } else if (k === 'riwayat') { title = 'Riwayat Perpindahan'; crumbs.push({ label: 'Riwayat Perpindahan' }); }
  else if (k === 'laporan') { title = 'Laporan'; crumbs.push({ label: 'Laporan' }); }
  else if (k === 'pengguna') { title = 'Manajemen Pengguna'; crumbs.push({ label: 'Manajemen Pengguna' }); }
  else if (k === 'pengaturan') { title = 'Pengaturan'; crumbs.push({ label: 'Pengaturan' }); }
  else { title = 'Halaman Tidak Ditemukan'; }

  useEffect(() => { document.title = title + ' — SIBER EVIDENCE'; }, [title]);

  const admin = user.role === 'Administrator';
  let page: React.ReactNode;
  if (k === 'dashboard') page = <DashboardPage />;
  else if (k === 'perkara') page = seg[1] ? <PerkaraDetailPage id={seg[1]} key={'pkd-' + seg[1]} /> : <PerkaraPage />;
  else if (k === 'barang-bukti') {
    if (!seg[1]) page = <BarangBuktiPage query={query} />;
    else if (seg[1] === 'baru') page = <BarangFormPage query={query} key="bb-baru" />;
    else if (seg[2] === 'edit') page = <BarangFormPage id={seg[1]} query={query} key={'bb-edit-' + seg[1]} />;
    else page = <BarangDetailPage id={seg[1]} query={query} key={'bbd-' + seg[1]} />;
  }
  else if (k === 'riwayat') page = <RiwayatPage query={query} />;
  else if (k === 'laporan') page = <LaporanPage />;
  else if (k === 'pengguna') page = admin ? <PenggunaPage /> : <NoAccess />;
  else if (k === 'pengaturan') page = <PengaturanPage />;
  else page = <NotFound />;

  return (
    <div className="min-h-screen bg-slate-50 text-slate-800">
      <aside className={cn('no-print fixed inset-y-0 left-0 z-40 hidden lg:block transition-all duration-200', collapsed ? 'w-[76px]' : 'w-64')}>
        <SidebarContent collapsed={collapsed} onToggleCollapse={toggleCollapsed} />
      </aside>

      {drawer && (
        <div className="no-print fixed inset-0 z-50 lg:hidden">
          <div className="absolute inset-0 bg-navy-950/60" onClick={() => setDrawer(false)} />
          <aside className="anim-slide absolute inset-y-0 left-0 w-72">
            <SidebarContent mobile collapsed={false} onToggleCollapse={toggleCollapsed} onNavigate={() => setDrawer(false)} />
          </aside>
        </div>
      )}

      <div className={cn('app-offset flex min-h-screen flex-col transition-[padding] duration-200', collapsed ? 'lg:pl-[76px]' : 'lg:pl-64')}>
        <Header title={title} crumbs={crumbs} onMenu={() => setDrawer(true)} />
        <main className="mx-auto w-full max-w-6xl flex-1 px-4 py-6 sm:px-6 lg:px-8 lg:py-8">{page}</main>
        <footer className="no-print border-t border-slate-200 px-6 py-4">
          <p className="text-center text-[11px] leading-relaxed text-slate-400">
            SIBER EVIDENCE v1.0 — Demo Kerja Praktik · Subbid Siber, Ditreskrimsus Polda Sulawesi Utara<br />
            Seluruh data bersifat contoh/fiktif dan tersimpan lokal di peramban Anda. Tidak terhubung ke sistem produksi Kepolisian.
          </p>
        </footer>
      </div>
    </div>
  );
}

/* ---------- Modal form perkara (dipakai di Dashboard & Data Perkara) ---------- */
function PerkaraFormModal({ open, initial, onClose }: { open: boolean; initial: Perkara | null; onClose: () => void }) {
  const { data, addPerkara, updatePerkara, toast } = useApp();
  const blank = { nomorLP: '', tanggalLaporan: todayISO(), uraian: '', tahap: 'Lidik', penyidik: '' };
  const [f, setF] = useState<any>(blank);
  const [errs, setErrs] = useState<any>({});
  useEffect(() => {
    if (open) {
      setF(initial
        ? { nomorLP: initial.nomorLP, tanggalLaporan: initial.tanggalLaporan, uraian: initial.uraian, tahap: initial.tahap, penyidik: initial.penyidik }
        : { ...blank, tanggalLaporan: todayISO() });
      setErrs({});
    }
  }, [open, initial]);
  const set = (key: string, v: string) => setF((o: any) => ({ ...o, [key]: v }));
  const petugasOpts = data.users.filter((u: UserAkun) => u.status === 'Aktif').map((u: UserAkun) => [u.nama, u.nama] as [string, string]);

  function submit() {
    const e: any = {};
    if (!f.nomorLP.trim()) e.nomorLP = 'Nomor LP wajib diisi.';
    else if (data.perkara.some((p: Perkara) => p.nomorLP.toLowerCase() === f.nomorLP.trim().toLowerCase() && (!initial || p.id !== initial.id)))
      e.nomorLP = 'Nomor LP sudah terdaftar.';
    if (!f.tanggalLaporan) e.tanggalLaporan = 'Tanggal laporan wajib diisi.';
    if (!f.uraian.trim()) e.uraian = 'Uraian singkat perkara wajib diisi.';
    if (!f.tahap) e.tahap = 'Pilih tahap penanganan.';
    if (!f.penyidik) e.penyidik = 'Pilih penyidik/petugas.';
    setErrs(e);
    if (Object.keys(e).length) { toast('error', 'Formulir belum lengkap', 'Periksa kembali isian yang ditandai merah.'); return; }
    if (initial) { updatePerkara(initial.id, f); toast('success', 'Perkara diperbarui', f.nomorLP + ' berhasil disimpan (demo).'); }
    else { addPerkara(f); toast('success', 'Perkara ditambahkan', f.nomorLP + ' tercatat pada data demo.'); }
    onClose();
  }

  return (
    <Modal open={open} onClose={onClose} width="max-w-xl"
      title={initial ? 'Edit Data Perkara' : 'Tambah Data Perkara'}
      desc={initial ? 'Perbarui informasi perkara pada data demo.' : 'Catat perkara baru sebelum mendaftarkan barang bukti terkait.'}
      footer={<Fragment>
        <Button variant="secondary" onClick={onClose}>Batal</Button>
        <Button icon="check" onClick={submit}>{initial ? 'Simpan Perubahan' : 'Simpan Perkara'}</Button>
      </Fragment>}>
      <div className="grid gap-4">
        <div className="grid gap-4 sm:grid-cols-2">
          <Field label="Nomor Laporan Polisi" required error={errs.nomorLP}>
            <Input value={f.nomorLP} error={errs.nomorLP} onChange={(e: any) => set('nomorLP', e.target.value)} placeholder="LP/000/roman/tahun/Ditreskrimsus" />
          </Field>
          <Field label="Tanggal Laporan" required error={errs.tanggalLaporan}>
            <Input type="date" value={f.tanggalLaporan} error={errs.tanggalLaporan} onChange={(e: any) => set('tanggalLaporan', e.target.value)} />
          </Field>
        </div>
        <Field label="Uraian Singkat Perkara" required error={errs.uraian}>
          <Textarea value={f.uraian} error={errs.uraian} onChange={(e: any) => set('uraian', e.target.value)} placeholder="Ringkas modus, waktu, dan lokasi kejadian (gunakan data fiktif)…" />
        </Field>
        <div className="grid gap-4 sm:grid-cols-2">
          <Field label="Tahap Penanganan" required error={errs.tahap}>
            <Select value={f.tahap} error={errs.tahap} onChange={(e: any) => set('tahap', e.target.value)} options={[['Lidik', 'Lidik'], ['Sidik', 'Sidik']]} />
          </Field>
          <Field label="Penyidik / Petugas" required error={errs.penyidik}>
            <Select value={f.penyidik} error={errs.penyidik} placeholder="Pilih penyidik…" onChange={(e: any) => set('penyidik', e.target.value)} options={petugasOpts} />
          </Field>
        </div>
      </div>
    </Modal>
  );
}

/* ---------- Data Perkara ---------- */
function PerkaraPage() {
  const { data, user, deletePerkara, toast } = useApp();
  const [q, setQ] = useState('');
  const [tahap, setTahap] = useState('');
  const [dari, setDari] = useState('');
  const [sampai, setSampai] = useState('');
  const [page, setPage] = useState(1);
  const PS = 8;
  const [formOpen, setFormOpen] = useState(false);
  const [editing, setEditing] = useState<Perkara | null>(null);
  const [delTarget, setDelTarget] = useState<Perkara | null>(null);

  useEffect(() => { setPage(1); }, [q, tahap, dari, sampai]);

  const filtered = useMemo(() => data.perkara.filter((p: Perkara) => {
    const s = q.trim().toLowerCase();
    if (s && !(p.nomorLP.toLowerCase().includes(s) || p.uraian.toLowerCase().includes(s) || p.penyidik.toLowerCase().includes(s))) return false;
    if (tahap && p.tahap !== tahap) return false;
    if (dari && p.tanggalLaporan < dari) return false;
    if (sampai && p.tanggalLaporan > sampai) return false;
    return true;
  }).sort((a: Perkara, b: Perkara) => b.tanggalLaporan.localeCompare(a.tanggalLaporan)), [data.perkara, q, tahap, dari, sampai]);

  const pages = Math.max(1, Math.ceil(filtered.length / PS));
  const cur = Math.min(page, pages);
  const paged = filtered.slice((cur - 1) * PS, cur * PS);
  const hasFilter = !!(q || tahap || dari || sampai);
  const linkedCount = (p: Perkara) => data.barang.filter((b: BarangBukti) => b.nomorLP === p.nomorLP).length;
  const delLinked = delTarget ? linkedCount(delTarget) : 0;

  function confirmDelete() {
    if (!delTarget) return;
    const r = deletePerkara(delTarget.id);
    if (r.ok) toast('success', 'Perkara dihapus', delTarget.nomorLP + ' telah dihapus dari data demo.');
    else toast('error', 'Gagal menghapus', r.msg);
    setDelTarget(null);
  }

  return (
    <div>
      <div className="flex flex-col gap-3 lg:flex-row lg:items-center lg:justify-between">
        <div className="flex flex-1 flex-wrap items-center gap-2">
          <SearchInput className="w-full sm:w-72" placeholder="Cari nomor LP atau nama perkara…" value={q} onChange={(e: any) => setQ(e.target.value)} />
          <Select className="w-36" value={tahap} onChange={(e: any) => setTahap(e.target.value)} options={[['', 'Semua Tahap'], ['Lidik', 'Lidik'], ['Sidik', 'Sidik']]} />
          <div className="flex items-center gap-1.5">
            <Input type="date" className="w-[150px]" value={dari} onChange={(e: any) => setDari(e.target.value)} title="Dari tanggal" />
            <span className="text-xs text-slate-400">s/d</span>
            <Input type="date" className="w-[150px]" value={sampai} onChange={(e: any) => setSampai(e.target.value)} title="Sampai tanggal" />
          </div>
          {hasFilter && (
            <button onClick={() => { setQ(''); setTahap(''); setDari(''); setSampai(''); }} className="text-xs font-semibold text-blue-600 hover:underline">
              Atur ulang
            </button>
          )}
        </div>
        <Button icon="plus" onClick={() => { setEditing(null); setFormOpen(true); }}>Tambah Perkara</Button>
      </div>

      <Card noPad className="mt-4">
        {paged.length ? (
          <div className="overflow-x-auto">
            <table className="w-full min-w-[880px] text-left text-sm">
              <thead>
                <tr className="border-b border-slate-200 bg-slate-50/80 text-[11px] uppercase tracking-wide text-slate-500">
                  <th className="px-5 py-3 font-semibold">Nomor LP</th>
                  <th className="px-4 py-3 font-semibold">Tanggal Laporan</th>
                  <th className="px-4 py-3 font-semibold">Nama / Judul Perkara</th>
                  <th className="px-4 py-3 font-semibold">Tahap</th>
                  <th className="px-4 py-3 font-semibold">Penyidik</th>
                  <th className="px-4 py-3 text-center font-semibold">Jumlah BB</th>
                  <th className="px-5 py-3 text-right font-semibold">Aksi</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-100">
                {paged.map((p: Perkara) => (
                  <tr key={p.id} className="transition hover:bg-slate-50/70">
                    <td className="whitespace-nowrap px-5 py-3.5"><a href={'#/perkara/' + p.id} className="font-semibold text-navy-800 hover:text-blue-700">{p.nomorLP}</a></td>
                    <td className="whitespace-nowrap px-4 py-3.5 text-xs tabular-nums text-slate-500">{fmtDate(p.tanggalLaporan)}</td>
                    <td className="max-w-[300px] px-4 py-3.5"><span className="line-clamp-2 text-slate-700" title={p.uraian}>{p.uraian}</span></td>
                    <td className="px-4 py-3.5"><Badge>{p.tahap}</Badge></td>
                    <td className="whitespace-nowrap px-4 py-3.5 text-slate-600">{p.penyidik}</td>
                    <td className="px-4 py-3.5 text-center">
                      <span className="inline-flex h-6 min-w-[26px] items-center justify-center rounded-full bg-slate-100 px-1.5 text-xs font-bold tabular-nums text-slate-600">{linkedCount(p)}</span>
                    </td>
                    <td className="px-5 py-3.5">
                      <div className="flex justify-end gap-1.5">
                        <IconBtn icon="eye" title="Lihat detail perkara" onClick={() => { window.location.hash = '#/perkara/' + p.id; }} />
                        <IconBtn icon="pencil" title="Edit perkara" onClick={() => { setEditing(p); setFormOpen(true); }} />
                        {user.role === 'Administrator' && <IconBtn icon="trash-2" tone="danger" title="Hapus perkara" onClick={() => setDelTarget(p)} />}
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        ) : (
          <EmptyState icon="folder-open" title="Tidak ada perkara yang cocok"
            desc="Ubah kata kunci pencarian atau filter, atau catat perkara baru untuk memulai."
            action={<Button icon="plus" onClick={() => { setEditing(null); setFormOpen(true); }}>Tambah Perkara</Button>} />
        )}
        <Pagination page={cur} pageSize={PS} total={filtered.length} onPage={setPage} />
      </Card>

      <DemoNote>Seluruh data perkara pada halaman ini adalah data contoh (demo) dan tidak merepresentasikan perkara sebenarnya.</DemoNote>

      <PerkaraFormModal open={formOpen} initial={editing} onClose={() => setFormOpen(false)} />
      <ConfirmDialog open={!!delTarget} onClose={() => setDelTarget(null)} onConfirm={confirmDelete}
        title="Hapus Data Perkara?" confirmLabel="Hapus Perkara" confirmDisabled={delLinked > 0}>
        <p>Data perkara <span className="font-semibold text-navy-800">{delTarget?.nomorLP}</span> akan dihapus dari penyimpanan demo dan tidak dapat dibatalkan.</p>
        {delLinked > 0 && (
          <p className="mt-2 rounded-lg border border-amber-200 bg-amber-50 px-3 py-2 text-xs font-medium text-amber-800">
            Masih terdapat {delLinked} barang bukti terkait. Hapus atau alihkan barang bukti tersebut terlebih dahulu.
          </p>
        )}
      </ConfirmDialog>
    </div>
  );
}

/* ---------- Data Barang Bukti ---------- */
function BarangBuktiPage({ query }: { query: URLSearchParams }) {
  const { data } = useApp();
  const { barang, perkara } = data;
  const [q, setQ] = useState(query.get('q') || '');
  const [kategori, setKategori] = useState(query.get('kategori') || '');
  const [status, setStatus] = useState(query.get('status') || '');
  const [tahap, setTahap] = useState(query.get('tahap') || '');
  const [page, setPage] = useState(1);
  const PS = 8;

  useEffect(() => {
    setQ(query.get('q') || ''); setKategori(query.get('kategori') || '');
    setStatus(query.get('status') || ''); setTahap(query.get('tahap') || '');
    setPage(1);
  }, [query.toString()]);

  const tahapOf = (lp: string) => { const p = perkara.find((x: Perkara) => x.nomorLP === lp); return p ? p.tahap : ''; };

  const filtered = useMemo(() => barang.filter((b: BarangBukti) => {
    const s = q.trim().toLowerCase();
    if (s && !(b.kode.toLowerCase().includes(s) || b.nama.toLowerCase().includes(s) || b.nomorLP.toLowerCase().includes(s)
      || b.lokasi.toLowerCase().includes(s) || (b.nomorSeri || '').toLowerCase().includes(s))) return false;
    if (kategori && b.kategori !== kategori) return false;
    if (status && b.status !== status) return false;
    if (tahap && tahapOf(b.nomorLP) !== tahap) return false;
    return true;
  }).sort((a: BarangBukti, b: BarangBukti) => a.kode.localeCompare(b.kode)), [barang, perkara, q, kategori, status, tahap]);

  const pages = Math.max(1, Math.ceil(filtered.length / PS));
  const cur = Math.min(page, pages);
  const paged = filtered.slice((cur - 1) * PS, cur * PS);
  const hasFilter = !!(q || kategori || status || tahap);

  return (
    <div>
      <div className="flex flex-col gap-3 lg:flex-row lg:items-center lg:justify-between">
        <div className="flex flex-1 flex-wrap items-center gap-2">
          <SearchInput className="w-full sm:w-72" placeholder="Cari kode, nama barang, atau nomor LP…" value={q} onChange={(e: any) => setQ(e.target.value)} />
          <Select className="w-44" value={kategori} onChange={(e: any) => setKategori(e.target.value)} placeholder="Semua Kategori" options={KATEGORI.map((k: string) => [k, k])} />
          <Select className="w-44" value={status} onChange={(e: any) => setStatus(e.target.value)} placeholder="Semua Status" options={STATUS_BB.map((s: string) => [s, s])} />
          <Select className="w-36" value={tahap} onChange={(e: any) => setTahap(e.target.value)} placeholder="Semua Tahap" options={[['Lidik', 'Lidik'], ['Sidik', 'Sidik']]} />
          {hasFilter && (
            <button onClick={() => { setQ(''); setKategori(''); setStatus(''); setTahap(''); }} className="text-xs font-semibold text-blue-600 hover:underline">
              Atur ulang
            </button>
          )}
        </div>
        <ButtonLink to="/barang-bukti/baru" icon="plus">Tambah Barang Bukti</ButtonLink>
      </div>

      <Card noPad className="mt-4">
        {paged.length ? (
          <div className="overflow-x-auto">
            <table className="w-full min-w-[1060px] text-left text-sm">
              <thead>
                <tr className="border-b border-slate-200 bg-slate-50/80 text-[11px] uppercase tracking-wide text-slate-500">
                  <th className="px-5 py-3 font-semibold">Kode BB</th>
                  <th className="px-4 py-3 font-semibold">Nama Barang Bukti</th>
                  <th className="px-4 py-3 font-semibold">Kategori</th>
                  <th className="px-4 py-3 font-semibold">Nomor LP</th>
                  <th className="px-4 py-3 font-semibold">Tgl Terima</th>
                  <th className="px-4 py-3 font-semibold">Kondisi</th>

                      <td className="whitespace-nowrap px-4 py-3.5 text-xs text-slate-500">{b.kategori}</td>

        ) : (
          <EmptyState icon="package" title="Tidak ada data yang cocok"
            desc="Tidak ditemukan barang bukti sesuai kata kunci atau filter yang dipilih."

        )}
        <Pagination page={cur} pageSize={PS} total={filtered.length} onPage={setPage} />
      </Card>

      <DemoNote>Contoh data memuat perangkat elektronik dan media penyimpanan digital fiktif, tanpa data pribadi maupun data perkara sebenarnya.</DemoNote>
    </div>
  );
}

/* ---------- Tambah / Edit Barang Bukti ---------- */
function BarangFormPage({ id, query }: { id?: string; query: URLSearchParams }) {
  const { data, user, addBarang, updateBarang, toast } = useApp();
  const editing = id ? data.barang.find((b: BarangBukti) => b.id === id) : undefined;
  const petugasOpts = data.users.filter((u: UserAkun) => u.status === 'Aktif').map((u: UserAkun) => [u.nama, u.nama] as [string, string]);
  const lpOpts = data.perkara.map((p: Perkara) => [p.nomorLP, p.nomorLP + ' — ' + (p.uraian.length > 42 ? p.uraian.slice(0, 42) + '…' : p.uraian)] as [string, string]);

  const [f, setF] = useState<any>(() => editing ? {
    kode: editing.kode, nama: editing.nama, kategori: editing.kategori, deskripsi: editing.deskripsi,
    nomorSeri: editing.nomorSeri, kondisi: editing.kondisi, nomorLP: editing.nomorLP,
    tanggalPenerimaan: editing.tanggalPenerimaan, petugasPenerima: editing.petugasPenerima,
    lokasi: editing.lokasi, status: editing.status, catatan: editing.catatan,
  } : {
    kode: nextKodeBB(data.barang), nama: '', kategori: 'Elektronik', deskripsi: '', nomorSeri: '',
    kondisi: 'Baik', nomorLP: query.get('lp') || '', tanggalPenerimaan: todayISO(),
    petugasPenerima: user ? user.nama : '', lokasi: '', status: 'Tersedia', catatan: '',
  });
  const [errs, setErrs] = useState<any>({});
  const [lamp, setLamp] = useState<Lampiran[]>(editing ? editing.lampiran : []);

  const set = (key: string, v: any) => setF((o: any) => ({ ...o, [key]: v }));

  function onFiles(e: any) {
    const files: File[] = Array.from(e.target.files || []);
    if (files.length) {
      setLamp((ls: Lampiran[]) => [...ls, ...files.map((fl: File) => ({ id: uid('lm'), nama: fl.name, tipe: fl.type || 'tidak diketahui', ukuran: fl.size }))]);
      toast('info', 'Metadata berkas ditambahkan', 'Demo hanya mencatat nama, jenis, dan ukuran berkas.');
    }
    e.target.value = '';
  }

  function submit(final: boolean) {
    const e: any = {};
    if (!f.kode.trim()) e.kode = 'Kode barang bukti wajib diisi.';
    else if (data.barang.some((b: BarangBukti) => b.kode.toLowerCase() === f.kode.trim().toLowerCase() && (!editing || b.id !== editing.id)))
      e.kode = 'Kode sudah digunakan oleh barang bukti lain.';
    if (!f.nama.trim()) e.nama = 'Nama barang bukti wajib diisi.';
    if (!f.kategori) e.kategori = 'Pilih kategori.';
    if (!f.kondisi) e.kondisi = 'Pilih kondisi fisik.';
    if (!f.nomorLP) e.nomorLP = 'Pilih nomor perkara (LP) terkait.';
    if (!f.tanggalPenerimaan) e.tanggalPenerimaan = 'Tanggal penerimaan wajib diisi.';
    if (!f.petugasPenerima) e.petugasPenerima = 'Petugas penerima wajib dipilih.';
    if (!f.lokasi) e.lokasi = 'Lokasi penyimpanan wajib dipilih.';
    if (!f.status) e.status = 'Status wajib dipilih.';
    setErrs(e);
    if (Object.keys(e).length) { toast('error', 'Formulir belum lengkap', 'Periksa kembali isian yang ditandai merah.'); return; }

    const payload = { ...f, lampiran: lamp, draf: !final };
    if (editing) {
      updateBarang(editing.id, payload);
      toast('success', 'Perubahan disimpan', final ? 'Data barang bukti berhasil diperbarui.' : 'Perubahan draft berhasil disimpan.');
      window.location.hash = '#/barang-bukti/' + editing.id;
    } else {
      const nb = addBarang(payload);
      toast('success', final ? 'Barang bukti terdaftar' : 'Draft disimpan',
        final ? nb.kode + ' tercatat beserta kejadian Penerimaan pada riwayat.' : nb.kode + ' disimpan sebagai draft dan dapat dilengkapi kemudian.');
      window.location.hash = '#/barang-bukti/' + nb.id;
    }
  }

  return (
    <div className="space-y-5">
      <a href={editing ? '#/barang-bukti/' + editing.id : '#/barang-bukti'} className="inline-flex items-center gap-1.5 text-xs font-semibold text-slate-500 transition hover:text-blue-700">
        <Icon name="arrow-left" size={14} />{editing ? 'Kembali ke detail' : 'Kembali ke Data Barang Bukti'}
      </a>

      <div>
        <h2 className="text-lg font-bold text-navy-800">{editing ? 'Edit Barang Bukti' : 'Tambah Barang Bukti'}</h2>
        <p className="mt-0.5 text-sm text-slate-500">{editing ? 'Perbarui data ' + editing.kode + ' pada penyimpanan demo.' : 'Daftarkan barang bukti baru beserta informasi perkara dan penyimpanannya.'}</p>
      </div>

      <div className="flex items-start gap-3 rounded-xl border border-amber-200 bg-amber-50 px-4 py-3">
        <Icon name="alert-triangle" size={18} className="mt-0.5 shrink-0 text-amber-600" />
        <div className="text-xs leading-relaxed text-amber-800">
          <p className="font-bold">Mode demo — jangan unggah berkas asli yang bersifat rahasia atau tergolong klasifikasi.</p>
          <p className="mt-0.5">Lampiran hanya menyimpan metadata (nama, jenis, ukuran) di penyimpanan lokal peramban dan tidak diunggah ke server mana pun.</p>
        </div>
      </div>

      {/* Informasi Umum */}
      <FormSection icon="package" title="Informasi Umum" desc="Identitas dan kondisi fisik barang bukti.">
        <Field label="Kode Barang Bukti" required error={errs.kode} hint="Kode unik untuk penelusuran dan pelabelan fisik.">
          <Input value={f.kode} error={errs.kode} onChange={(e: any) => set('kode', e.target.value)} />
        </Field>
        <Field label="Nama Barang Bukti" required error={errs.nama}>
          <Input value={f.nama} error={errs.nama} onChange={(e: any) => set('nama', e.target.value)} placeholder="cth. Telepon Pintar Merk X Warna Hitam" />
        </Field>
        <Field label="Kategori" required error={errs.kategori}>
          <Select value={f.kategori} error={errs.kategori} onChange={(e: any) => set('kategori', e.target.value)} options={KATEGORI.map((k: string) => [k, k])} />
        </Field>
        <Field label="Nomor Seri / IMEI (Opsional)">
          <Input value={f.nomorSeri} onChange={(e: any) => set('nomorSeri', e.target.value)} placeholder="Kosongkan jika tidak terbaca" />
        </Field>
        <Field label="Kondisi Fisik" required error={errs.kondisi}>
          <Select value={f.kondisi} error={errs.kondisi} onChange={(e: any) => set('kondisi', e.target.value)} options={KONDISI.map((k: string) => [k, k])} />
        </Field>
        <Field label="Deskripsi" className="sm:col-span-2">
          <Textarea value={f.deskripsi} onChange={(e: any) => set('deskripsi', e.target.value)} placeholder="Ciri fisik, kelengkapan, keadaan saat diterima (data fiktif)…" />
        </Field>
      </FormSection>

      {/* Informasi Perkara */}
      <FormSection icon="briefcase" title="Informasi Perkara" desc="Kaitan barang bukti dengan laporan polisi.">
        <Field label="Nomor Perkara (LP)" required error={errs.nomorLP}>
          <Select value={f.nomorLP} error={errs.nomorLP} placeholder="Pilih nomor LP…" onChange={(e: any) => set('nomorLP', e.target.value)} options={lpOpts} />
        </Field>
        <Field label="Tanggal Penerimaan" required error={errs.tanggalPenerimaan}>
          <Input type="date" value={f.tanggalPenerimaan} error={errs.tanggalPenerimaan} onChange={(e: any) => set('tanggalPenerimaan', e.target.value)} />
        </Field>
        <Field label="Petugas Penerima" required error={errs.petugasPenerima} className="sm:col-span-2">
          <Select value={f.petugasPenerima} error={errs.petugasPenerima} placeholder="Pilih petugas penerima…" onChange={(e: any) => set('petugasPenerima', e.target.value)} options={petugasOpts} />
        </Field>
      </FormSection>

      {/* Informasi Penyimpanan */}
      <FormSection icon="archive" title="Informasi Penyimpanan" desc="Lokasi, status, dan catatan penyimpanan.">
        <Field label="Lokasi Penyimpanan" required error={errs.lokasi}>
          <Select value={f.lokasi} error={errs.lokasi} placeholder="Pilih lokasi…" onChange={(e: any) => set('lokasi', e.target.value)} options={LOKASI.map((l: string) => [l, l])} />
        </Field>
        <Field label="Status Penyimpanan" required error={errs.status}>
          <Select value={f.status} error={errs.status} onChange={(e: any) => set('status', e.target.value)} options={STATUS_BB.map((s: string) => [s, s])} />
        </Field>
        <Field label="Catatan Penyimpanan" className="sm:col-span-2">
          <Textarea value={f.catatan} onChange={(e: any) => set('catatan', e.target.value)} placeholder="cth. Disimpan menunggu jadwal pemeriksaan forensik digital…" />
        </Field>
      </FormSection>

      {/* Lampiran */}
      <FormSection icon="paperclip" title="Lampiran / Dokumen Pendukung (Opsional)" desc="Berita acara, foto kondisi, atau dokumen terkait.">
        <div className="sm:col-span-2">
          <div className="rounded-lg border border-dashed border-slate-300 bg-slate-50/60 p-4">
            <label className="flex cursor-pointer flex-col items-center justify-center gap-1 py-3 text-center">
              <Icon name="upload" size={20} className="text-slate-400" />
              <span className="text-xs font-semibold text-slate-600">Pilih berkas untuk ditambahkan</span>
              <span className="text-[11px] text-slate-400">PDF, gambar, atau dokumen — hanya nama, jenis, dan ukuran yang dicatat</span>
              <input type="file" multiple className="hidden" onChange={onFiles} />
            </label>
            {lamp.length > 0 && (
              <ul className="mt-3 space-y-2">
                {lamp.map((l: Lampiran) => (
                  <li key={l.id} className="flex items-center gap-3 rounded-lg border border-slate-200 bg-white px-3 py-2">
                    <Icon name="paperclip" size={14} className="shrink-0 text-slate-400" />
                    <div className="min-w-0 flex-1">
                      <p className="truncate text-xs font-semibold text-navy-800">{l.nama}</p>
                      <p className="text-[11px] text-slate-400">{l.tipe} · {fmtBytes(l.ukuran)}</p>
                    </div>
                    <button type="button" onClick={() => setLamp((ls: Lampiran[]) => ls.filter((x: Lampiran) => x.id !== l.id))}
                      className="shrink-0 text-slate-400 transition hover:text-red-600" aria-label="Hapus lampiran">
                      <Icon name="x" size={14} />
                    </button>
                  </li>
                ))}
              </ul>
            )}
          </div>
        </div>
      </FormSection>

      <div className="flex flex-wrap items-center justify-end gap-2 border-t border-slate-200 pt-5">
        <Button variant="ghost" onClick={() => { window.location.hash = editing ? '#/barang-bukti/' + editing.id : '#/barang-bukti'; }}>Batal</Button>
        <Button variant="secondary" icon="save" onClick={() => submit(false)}>Simpan sebagai Draft</Button>
        <Button icon="check" onClick={() => submit(true)}>{editing ? 'Simpan Perubahan' : 'Simpan & Daftarkan'}</Button>
      </div>

      <DemoNote>Menyimpan sebagai draft tidak mencatat kejadian Penerimaan; kejadian baru tercatat ketika draft didaftarkan melalui tombol Simpan.</DemoNote>
    </div>
  );
}

/* ---------- Modal kejadian barang bukti (perpindahan / peminjaman / dsb.) ---------- */
function MovementModal({ open, onClose, fixedKode }: { open: boolean; onClose: () => void; fixedKode?: string }) {
  const { data, addRiwayat, toast } = useApp();
  const items = data.barang.filter((b: BarangBukti) => !b.draf && b.status !== 'Dihancurkan');
  const petugasOpts = data.users.filter((u: UserAkun) => u.status === 'Aktif').map((u: UserAkun) => [u.nama, u.nama] as [string, string]);
  const lokasiOpts = LOKASI.map((l: string) => [l, l] as [string, string]);

  const [f, setF] = useState<any>(() => ({
    kodeBB: fixedKode || '', jenis: 'Perpindahan', lokasiAsal: '', lokasiTujuan: '', petugas: '',
    tanggalWaktu: nowLocal(), alasan: '', catatan: '', harapanKembali: '',
  }));
  const [errs, setErrs] = useState<any>({});

  useEffect(() => {
    if (!open) return;
    const b = fixedKode ? data.barang.find((x: BarangBukti) => x.kode === fixedKode) : undefined;
    setF({ kodeBB: b ? b.kode : '', jenis: 'Perpindahan', lokasiAsal: b ? b.lokasi : '', lokasiTujuan: '', petugas: '', tanggalWaktu: nowLocal(), alasan: '', catatan: '', harapanKembali: '' });
    setErrs({});
  }, [open, fixedKode]);

  const set = (key: string, v: string) => setF((o: any) => ({ ...o, [key]: v }));
  const onBarang = (kode: string) => {
    const b = data.barang.find((x: BarangBukti) => x.kode === kode);
    setF((o: any) => ({ ...o, kodeBB: kode, lokasiAsal: b ? b.lokasi : '' }));
  };
  const hasOpenLoan = f.kodeBB && data.riwayat.some((r: Riwayat) => r.kodeBB === f.kodeBB && r.jenis === 'Peminjaman' && r.statusKembali === 'Belum Kembali');

  function submit() {
    const e: any = {};
    if (!f.kodeBB) e.kodeBB = 'Pilih barang bukti.';
    if (f.jenis !== 'Penerimaan' && !f.lokasiAsal) e.lokasiAsal = 'Lokasi asal wajib dipilih.';
    if (!f.lokasiTujuan) e.lokasiTujuan = 'Lokasi tujuan wajib dipilih.';
    if (!f.petugas) e.petugas = 'Petugas yang menangani wajib dipilih.';
    if (!f.tanggalWaktu) e.tanggalWaktu = 'Tanggal dan waktu wajib diisi.';
    if (!f.alasan.trim()) e.alasan = 'Alasan/keperluan wajib diisi.';
    if (f.jenis === 'Peminjaman') {
      if (!f.harapanKembali) e.harapanKembali = 'Tanggal harapan kembali wajib diisi untuk peminjaman.';
      else if (f.tanggalWaktu && f.harapanKembali < f.tanggalWaktu.slice(0, 10)) e.harapanKembali = 'Tanggal kembali tidak wajar (sebelum tanggal kejadian).';
    }
    setErrs(e);
    if (Object.keys(e).length) { toast('error', 'Data belum lengkap', 'Periksa kembali isian yang ditandai merah.'); return; }
    addRiwayat({
      kodeBB: f.kodeBB, jenis: f.jenis, tanggalWaktu: f.tanggalWaktu,
      lokasiAsal: f.jenis === 'Penerimaan' ? 'Penyerahan Penyidik' : f.lokasiAsal,
      lokasiTujuan: f.lokasiTujuan, petugas: f.petugas, alasan: f.alasan.trim(), catatan: f.catatan.trim(),
      harapanKembali: f.jenis === 'Peminjaman' ? f.harapanKembali : '',
      statusKembali: f.jenis === 'Peminjaman' ? 'Belum Kembali' : '',
    });
    toast('success', 'Kejadian tercatat', f.jenis + ' untuk ' + f.kodeBB + ' berhasil dicatat pada riwayat (demo).');
    onClose();
  }

  return (
    <Modal open={open} onClose={onClose} width="max-w-2xl"
      title="Catat Kejadian Barang Bukti"
      desc="Rekam perpindahan, peminjaman, pengembalian, pemeriksaan, penerimaan, atau pengalihan. Riwayat sebelumnya tidak pernah ditimpa — setiap kejadian ditambahkan sebagai catatan baru."
      footer={<Fragment>
        <Button variant="secondary" onClick={onClose}>Batal</Button>
        <Button icon="check" onClick={submit}>Catat Kejadian</Button>
      </Fragment>}>
      <div className="grid gap-4 sm:grid-cols-2">
        <Field label="Barang Bukti" required error={errs.kodeBB} className="sm:col-span-2">
          <Select value={f.kodeBB} error={errs.kodeBB} placeholder="Pilih kode barang bukti…" disabled={!!fixedKode}
            onChange={(e: any) => onBarang(e.target.value)}
            options={items.map((b: BarangBukti) => [b.kode, b.kode + ' — ' + b.nama] as [string, string])} />
        </Field>
        <Field label="Jenis Kejadian" required>
          <Select value={f.jenis} onChange={(e: any) => set('jenis', e.target.value)} options={JENIS_RIWAYAT.map((j: string) => [j, j])} />
        </Field>
        <Field label="Tanggal & Waktu" required error={errs.tanggalWaktu}>
          <Input type="datetime-local" value={f.tanggalWaktu} error={errs.tanggalWaktu} onChange={(e: any) => set('tanggalWaktu', e.target.value)} />
        </Field>
        <Field label="Lokasi Asal" required={f.jenis !== 'Penerimaan'} error={errs.lokasiAsal}
          hint={f.jenis === 'Penerimaan' ? 'Penerimaan awal: barang diserahkan oleh penyidik.' : undefined}>
          <Select value={f.jenis === 'Penerimaan' ? 'Penyerahan Penyidik' : f.lokasiAsal}
            disabled={f.jenis === 'Penerimaan'} error={errs.lokasiAsal} placeholder="Pilih lokasi asal…"
            onChange={(e: any) => set('lokasiAsal', e.target.value)}
            options={f.jenis === 'Penerimaan' ? [['Penyerahan Penyidik', 'Penyerahan Penyidik']] : lokasiOpts} />
        </Field>
        <Field label="Lokasi Tujuan" required error={errs.lokasiTujuan}
          hint={f.jenis === 'Pengembalian' ? 'Barang dikembalikan ke lokasi penyimpanan tetap.' : undefined}>
          <Select value={f.lokasiTujuan} error={errs.lokasiTujuan} placeholder="Pilih lokasi tujuan…"
            onChange={(e: any) => set('lokasiTujuan', e.target.value)}
            options={f.jenis === 'Pengalihan' ? [...lokasiOpts, ['Pemusnahan (sesuai Berita Acara)', 'Pemusnahan (sesuai Berita Acara)']] : lokasiOpts} />
        </Field>
        {f.jenis === 'Peminjaman' && (
          <Field label="Tanggal Harapan Kembali" required error={errs.harapanKembali}>
            <Input type="date" value={f.harapanKembali} error={errs.harapanKembali} onChange={(e: any) => set('harapanKembali', e.target.value)} />
          </Field>
        )}
        <Field label="Petugas yang Menangani" required error={errs.petugas} className={f.jenis === 'Peminjaman' ? '' : 'sm:col-span-1'}>
          <Select value={f.petugas} error={errs.petugas} placeholder="Pilih petugas…" onChange={(e: any) => set('petugas', e.target.value)} options={petugasOpts} />
        </Field>
        <Field label="Alasan / Keperluan" required error={errs.alasan} className="sm:col-span-2">
          <Input value={f.alasan} error={errs.alasan} onChange={(e: any) => set('alasan', e.target.value)} placeholder="cth. Pemeriksaan forensik digital (ekstraksi data)" />
        </Field>
        <Field label="Catatan" className="sm:col-span-2">
          <Textarea value={f.catatan} onChange={(e: any) => set('catatan', e.target.value)} placeholder="Catatan tambahan (opsional)…" />
        </Field>

        {f.jenis === 'Peminjaman' && (

            Status barang akan otomatis menjadi <b>Dipinjam</b> dan tercatat <b>Belum Kembali</b> sampai kejadian Pengembalian direkam.
          </p>
        )}
        {f.jenis === 'Pengembalian' && (
          <p className={cn('flex items-start gap-2 rounded-lg border px-3 py-2 text-[11px] leading-relaxed sm:col-span-2',
            hasOpenLoan ? 'border-emerald-200 bg-emerald-50 text-emerald-800' : 'border-slate-200 bg-slate-50 text-slate-600')}>
            <Icon name="info" size={13} className="mt-0.5 shrink-0" />
            {hasOpenLoan
              ? 'Terdapat peminjaman aktif untuk barang ini — akan ditandai Sudah Kembali dan status barang kembali menjadi Tersedia.'
              : 'Tidak terdapat peminjaman aktif untuk barang ini; status barang akan menjadi Tersedia.'}
          </p>
        )}
      </div>
    </Modal>
  );
}
