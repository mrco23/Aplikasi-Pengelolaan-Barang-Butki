/* ---------- Riwayat Perpindahan ---------- */
function RiwayatPage({ query }: { query: URLSearchParams }) {
  const { data } = useApp();
  const [q, setQ] = useState('');
  const [jenis, setJenis] = useState('');
  const [kode, setKode] = useState(query.get('kode') || '');
  const [dari, setDari] = useState('');
  const [sampai, setSampai] = useState('');
  const [page, setPage] = useState(1);
  const PS = 10;
  const [moveOpen, setMoveOpen] = useState(false);

  useEffect(() => { setKode(query.get('kode') || ''); setPage(1); }, [query.toString()]);
  useEffect(() => { setPage(1); }, [q, jenis, kode, dari, sampai]);

  const kodeOpts = useMemo(() => Array.from(new Set(data.barang.map((b: BarangBukti) => b.kode))).sort(), [data.barang]);

  const filtered = useMemo(() => data.riwayat.filter((r: Riwayat) => {
    const s = q.trim().toLowerCase();
    if (s && !(r.kodeBB.toLowerCase().includes(s) || r.petugas.toLowerCase().includes(s) || r.alasan.toLowerCase().includes(s)
      || r.lokasiAsal.toLowerCase().includes(s) || r.lokasiTujuan.toLowerCase().includes(s) || (r.catatan || '').toLowerCase().includes(s))) return false;
    if (jenis && r.jenis !== jenis) return false;
    if (kode && r.kodeBB !== kode) return false;
    const d = r.tanggalWaktu.slice(0, 10);
    if (dari && d < dari) return false;
    if (sampai && d > sampai) return false;
    return true;
  }).sort((a: Riwayat, b: Riwayat) => b.tanggalWaktu.localeCompare(a.tanggalWaktu)), [data.riwayat, q, jenis, kode, dari, sampai]);

  const pages = Math.max(1, Math.ceil(filtered.length / PS));
  const cur = Math.min(page, pages);
  const paged = filtered.slice((cur - 1) * PS, cur * PS);
  const hasFilter = !!(q || jenis || kode || dari || sampai);
  const idOf = (kodeBB: string) => { const b = data.barang.find((x: BarangBukti) => x.kode === kodeBB); return b ? b.id : ''; };

  return (
    <div>
      <div className="mb-5 flex items-start gap-3 rounded-xl border border-blue-100 bg-blue-50 px-4 py-3">
        <Icon name="info" size={16} className="mt-0.5 shrink-0 text-blue-600" />
        <p className="text-xs leading-relaxed text-blue-900">
          <span className="font-bold">Catatan:</span> Antarmuka ini merupakan prototipe log administratif untuk keperluan Kerja Praktik.
          Riwayat yang ditampilkan tidak menegakkan integritas forensik maupun kelayakan hukum suatu barang bukti secara mandiri.
        </p>
      </div>

      <div className="flex flex-col gap-3 lg:flex-row lg:items-center lg:justify-between">
        <div className="flex flex-1 flex-wrap items-center gap-2">
          <SearchInput className="w-full sm:w-64" placeholder="Cari kode, petugas, alasan…" value={q} onChange={(e: any) => setQ(e.target.value)} />
          <Select className="w-40" value={jenis} onChange={(e: any) => setJenis(e.target.value)} placeholder="Semua Jenis" options={JENIS_RIWAYAT.map((j: string) => [j, j])} />
          <Select className="w-44" value={kode} onChange={(e: any) => setKode(e.target.value)} placeholder="Semua Kode BB" options={kodeOpts.map((k: string) => [k, k])} />
          <div className="flex items-center gap-1.5">
            <Input type="date" className="w-[150px]" value={dari} onChange={(e: any) => setDari(e.target.value)} title="Dari tanggal" />
            <span className="text-xs text-slate-400">s/d</span>
            <Input type="date" className="w-[150px]" value={sampai} onChange={(e: any) => setSampai(e.target.value)} title="Sampai tanggal" />
          </div>
          {hasFilter && (
            <button onClick={() => { setQ(''); setJenis(''); setKode(''); setDari(''); setSampai(''); }} className="text-xs font-semibold text-blue-600 hover:underline">
              Atur ulang
            </button>
          )}
        </div>
        <Button icon="arrow-right-left" onClick={() => setMoveOpen(true)}>Catat Perpindahan / Peminjaman</Button>
      </div>

      <Card noPad className="mt-4">
        {paged.length ? (
          <div className="overflow-x-auto">
            <table className="w-full min-w-[1120px] text-left text-sm">
              <thead>
                <tr className="border-b border-slate-200 bg-slate-50/80 text-[11px] uppercase tracking-wide text-slate-500">
                  <th className="px-5 py-3 font-semibold">Tanggal & Waktu</th>
                  <th className="px-4 py-3 font-semibold">Kode BB</th>
                  <th className="px-4 py-3 font-semibold">Jenis Aktivitas</th>
                  <th className="px-4 py-3 font-semibold">Lokasi Asal</th>
                  <th className="px-4 py-3 font-semibold">Lokasi Tujuan</th>
                  <th className="px-4 py-3 font-semibold">Petugas</th>
                  <th className="px-4 py-3 font-semibold">Alasan</th>
                  <th className="px-5 py-3 font-semibold">Catatan</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-100">
                {paged.map((r: Riwayat) => {
                  const m = JENIS_META[r.jenis] || JENIS_META.Perpindahan;
                  const bid = idOf(r.kodeBB);
                  return (
                    <tr key={r.id} className="align-top transition hover:bg-slate-50/70">
                      <td className="whitespace-nowrap px-5 py-3.5 text-xs tabular-nums text-slate-500">{fmtDateTime(r.tanggalWaktu)}</td>
                      <td className="whitespace-nowrap px-4 py-3.5">
                        {bid
                          ? <a href={'#/barang-bukti/' + bid} className="text-xs font-bold text-navy-800 hover:text-blue-700">{r.kodeBB}</a>
                          : <span className="text-xs font-bold text-navy-800">{r.kodeBB}</span>}
                      </td>
                      <td className="px-4 py-3.5">
                        <span className={cn('inline-flex items-center gap-1 whitespace-nowrap rounded-full px-2 py-0.5 text-[11px] font-semibold ring-1 ring-inset', m.badge)}>
                          <Icon name={m.icon} size={11} />{r.jenis}
                        </span>
                        {r.jenis === 'Peminjaman' && r.harapanKembali && (
                          <div className="mt-1.5 flex flex-wrap items-center gap-1.5 text-[11px] text-slate-500">
                            <span>kembali: <span className="font-semibold text-slate-700">{fmtDate(r.harapanKembali)}</span></span>
                            {r.statusKembali && <Badge tone={r.statusKembali}>{r.statusKembali}</Badge>}
                          </div>
                        )}
                      </td>
                      <td className="max-w-[170px] px-4 py-3.5"><span className="block truncate text-xs text-slate-600" title={r.lokasiAsal}>{r.lokasiAsal}</span></td>
                      <td className="max-w-[170px] px-4 py-3.5"><span className="block truncate text-xs font-medium text-navy-800" title={r.lokasiTujuan}>{r.lokasiTujuan}</span></td>
                      <td className="whitespace-nowrap px-4 py-3.5 text-xs text-slate-600">{r.petugas}</td>
                      <td className="max-w-[200px] px-4 py-3.5"><span className="block truncate text-xs text-slate-600" title={r.alasan}>{r.alasan}</span></td>
                      <td className="max-w-[200px] px-5 py-3.5"><span className="block truncate text-xs text-slate-400" title={r.catatan}>{r.catatan || '—'}</span></td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        ) : (
          <EmptyState icon="history" title="Tidak ada kejadian yang cocok"
            desc="Belum terdapat riwayat perpindahan sesuai filter. Rekam kejadian baru melalui tombol Catat Perpindahan."
            action={<Button variant="secondary" icon="rotate-ccw" onClick={() => { setQ(''); setJenis(''); setKode(''); setDari(''); setSampai(''); }}>Atur Ulang Filter</Button>} />
        )}
        <Pagination page={cur} pageSize={PS} total={filtered.length} onPage={setPage} />
      </Card>

      <DemoNote>Riwayat bersifat tambah-saja (append-only): entri sebelumnya tidak pernah ditimpa — perubahan direpresentasikan sebagai kejadian baru.</DemoNote>

      <MovementModal open={moveOpen} onClose={() => setMoveOpen(false)} />
    </div>
  );
}

/* ---------- Laporan ---------- */
function LaporanPage() {
  const { data, user, toast } = useApp();
  const [jenis, setJenis] = useState('rekap');
  const [dari, setDari] = useState('2025-03-01');
  const [sampai, setSampai] = useState('2025-05-31');
  const [lp, setLp] = useState('');
  const [kategori, setKategori] = useState('');
  const [status, setStatus] = useState('');
  const [tahap, setTahap] = useState('');

  const countBy = (list: BarangBukti[], s: StatusBB) => list.filter((b: BarangBukti) => b.status === s).length;

  const bbFiltered = useMemo(() => data.barang.filter((b: BarangBukti) => {
    if (b.draf) return false;
    if (b.tanggalPenerimaan < dari || b.tanggalPenerimaan > sampai) return false;
    if (kategori && b.kategori !== kategori) return false;
    if (status && b.status !== status) return false;
    if (lp && b.nomorLP !== lp) return false;
    if (tahap) {
      const p = data.perkara.find((x: Perkara) => x.nomorLP === b.nomorLP);
      if (!p || p.tahap !== tahap) return false;
    }
    return true;
  }), [data, dari, sampai, kategori, status, lp, tahap]);

  const pkFiltered = useMemo(() => data.perkara.filter((p: Perkara) => {
    if (p.tanggalLaporan < dari || p.tanggalLaporan > sampai) return false;
    if (lp && p.nomorLP !== lp) return false;
    if (tahap && p.tahap !== tahap) return false;
    return true;
  }), [data, dari, sampai, lp, tahap]);

  const rvFiltered = useMemo(() => data.riwayat.filter((r: Riwayat) => {
    const d = r.tanggalWaktu.slice(0, 10);
    if (d < dari || d > sampai) return false;
    const b = data.barang.find((x: BarangBukti) => x.kode === r.kodeBB);
    if (lp && (!b || b.nomorLP !== lp)) return false;
    if (kategori && (!b || b.kategori !== kategori)) return false;
    if (status && (!b || b.status !== status)) return false;
    if (tahap) {
      const p = b && data.perkara.find((x: Perkara) => x.nomorLP === b.nomorLP);
      if (!p || p.tahap !== tahap) return false;
    }
    return true;
  }), [data, dari, sampai, lp, kategori, status, tahap]);

  function buildReport(): { title: string; headers: string[]; rows: (string | number)[][]; total: (string | number)[] } {
    if (jenis === 'perkara') {
      const rows = pkFiltered.map((p: Perkara) => [
        p.nomorLP, p.uraian, p.tahap, p.penyidik, fmtDate(p.tanggalLaporan),
        data.barang.filter((b: BarangBukti) => b.nomorLP === p.nomorLP && !b.draf).length,
      ]);
      const sum = rows.reduce((a: number, r: any) => a + (r[5] as number), 0);
      return {
        title: 'Laporan per Perkara',
        headers: ['Nomor LP', 'Uraian Perkara', 'Tahap', 'Penyidik', 'Tgl Laporan', 'Jumlah BB'],
        rows, total: ['TOTAL', '', '', '', pkFiltered.length + ' perkara', sum],
      };
    }
    if (jenis === 'penyimpanan') {
      const lok = Array.from(new Set(bbFiltered.map((b: BarangBukti) => b.lokasi))).sort();
      const rows = lok.map((l: string) => {
        const list = bbFiltered.filter((b: BarangBukti) => b.lokasi === l);
        return [l, list.length, countBy(list, 'Tersedia'), countBy(list, 'Dipinjam'), countBy(list, 'Dalam Pemeriksaan'), countBy(list, 'Dihancurkan')];
      });
      return {
        title: 'Laporan Status Penyimpanan',
        headers: ['Lokasi Penyimpanan', 'Jumlah', 'Tersedia', 'Dipinjam', 'Dalam Pemeriksaan', 'Dihancurkan'],
        rows,
        total: ['TOTAL', bbFiltered.length, countBy(bbFiltered, 'Tersedia'), countBy(bbFiltered, 'Dipinjam'), countBy(bbFiltered, 'Dalam Pemeriksaan'), countBy(bbFiltered, 'Dihancurkan')],
      };
    }
    if (jenis === 'riwayat') {
      const rows = [...rvFiltered].sort((a: Riwayat, b: Riwayat) => b.tanggalWaktu.localeCompare(a.tanggalWaktu)).map((r: Riwayat) =>
        [fmtDateTime(r.tanggalWaktu), r.kodeBB, r.jenis, r.lokasiAsal, r.lokasiTujuan, r.petugas, r.alasan]);
      const pending = rvFiltered.filter((r: Riwayat) => r.jenis === 'Peminjaman' && r.statusKembali === 'Belum Kembali').length;
      return {
        title: 'Laporan Riwayat Perpindahan',
        headers: ['Tanggal & Waktu', 'Kode BB', 'Jenis', 'Lokasi Asal', 'Lokasi Tujuan', 'Petugas', 'Alasan'],
        rows,
        total: ['TOTAL', rows.length + ' kejadian', '', '', '', pending + ' pinjaman belum kembali', ''],
      };
    }
    // rekapitulasi (default)
    const rows = KATEGORI.map((k: string) => {
      const list = bbFiltered.filter((b: BarangBukti) => b.kategori === k);
      return [k, list.length, countBy(list, 'Tersedia'), countBy(list, 'Dipinjam'), countBy(list, 'Dalam Pemeriksaan'), countBy(list, 'Dihancurkan')];
    });
    return {
      title: 'Rekapitulasi Barang Bukti',
      headers: ['Kategori', 'Jumlah', 'Tersedia', 'Dipinjam', 'Dalam Pemeriksaan', 'Dihancurkan'],
      rows,
      total: ['TOTAL', bbFiltered.length, countBy(bbFiltered, 'Tersedia'), countBy(bbFiltered, 'Dipinjam'), countBy(bbFiltered, 'Dalam Pemeriksaan'), countBy(bbFiltered, 'Dihancurkan')],
    };
  }

  const rep = buildReport();

  function doExport() {
    const fname = `laporan-${jenis}-${todayISO()}.csv`;
    exportCsv(fname, rep.headers, [...rep.rows, rep.total]);
    toast('success', 'Ekspor CSV berhasil', 'Berkas ' + fname + ' diunduh (berisi data demo).');
  }

  return (
    <div className="space-y-5">
      <Card noPad className="no-print" title="Filter Laporan" desc="Sesuaikan parameter sebelum melihat pratinjau, mencetak, atau mengekspor."
        actions={<div className="flex gap-2">
          <Button variant="secondary" size="sm" icon="printer" onClick={() => window.print()}>Cetak</Button>
          <Button size="sm" icon="download" onClick={doExport}>Ekspor CSV</Button>
        </div>}>
        <div className="grid gap-4 px-5 py-5 sm:grid-cols-2 lg:grid-cols-4">
          <Field label="Jenis Laporan" required>
            <Select value={jenis} onChange={(e: any) => setJenis(e.target.value)} options={[
              ['rekap', 'Rekapitulasi Barang Bukti'],
              ['perkara', 'Laporan per Perkara'],
              ['penyimpanan', 'Laporan Status Penyimpanan'],
              ['riwayat', 'Laporan Riwayat Perpindahan'],
            ]} />
          </Field>
          <Field label="Dari Tanggal">
            <Input type="date" value={dari} onChange={(e: any) => setDari(e.target.value)} />
          </Field>
          <Field label="Sampai Tanggal">
            <Input type="date" value={sampai} onChange={(e: any) => setSampai(e.target.value)} />
          </Field>
          <Field label="Nomor Perkara">
            <Select value={lp} onChange={(e: any) => setLp(e.target.value)} placeholder="Semua Perkara"
              options={data.perkara.map((p: Perkara) => [p.nomorLP, p.nomorLP] as [string, string])} />
          </Field>
          <Field label="Kategori">
            <Select value={kategori} onChange={(e: any) => setKategori(e.target.value)} placeholder="Semua Kategori" options={KATEGORI.map((k: string) => [k, k])} />
          </Field>
          <Field label="Status Penyimpanan">
            <Select value={status} onChange={(e: any) => setStatus(e.target.value)} placeholder="Semua Status" options={STATUS_BB.map((s: string) => [s, s])} />
          </Field>
          <Field label="Tahap Perkara">
            <Select value={tahap} onChange={(e: any) => setTahap(e.target.value)} placeholder="Semua Tahap" options={[['Lidik', 'Lidik'], ['Sidik', 'Sidik']]} />
          </Field>
        </div>
        <p className="border-t border-slate-100 px-5 py-3 text-[11px] leading-relaxed text-slate-400">
          Rentang tanggal berlaku pada: tanggal penerimaan (rekapitulasi & status penyimpanan), tanggal laporan (per perkara),
          dan tanggal kejadian (riwayat perpindahan). Filter kategori/status/tahap menyaring barang bukti terkait.
        </p>
      </Card>

      <Card noPad className="print-region">
        <div className="border-b border-slate-100 px-5 py-4">
          <h3 className="text-sm font-bold text-navy-800">{rep.title}</h3>
          <p className="mt-0.5 text-xs text-slate-500">
            Periode: {fmtDate(dari)} s.d. {fmtDate(sampai)} · Dibuat: {fmtDateTime(nowLocal())} · Sumber: data demo
          </p>
        </div>
        {rep.rows.length ? (
          <div className="overflow-x-auto">
            <table className="w-full min-w-[760px] text-left text-sm">
              <thead>
                <tr className="border-b border-slate-200 bg-slate-50/80 text-[11px] uppercase tracking-wide text-slate-500">
                  {rep.headers.map((h: string, i: number) => <th key={i} className="px-4 py-3 font-semibold">{h}</th>)}
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-100">
                {rep.rows.map((r: any, i: number) => (
                  <tr key={i} className="transition hover:bg-slate-50/60">
                    {r.map((c: any, j: number) => (
                      <td key={j} className={cn('px-4 py-3', j === 0 ? 'font-medium text-navy-800' : 'text-slate-700', typeof c === 'number' && 'tabular-nums')}>{c}</td>
                    ))}
                  </tr>
                ))}
              </tbody>
              <tfoot>
                <tr className="border-t-2 border-slate-200 bg-slate-50">
                  {rep.total.map((c: any, j: number) => (
                    <td key={j} className="px-4 py-3 text-xs font-bold uppercase tracking-wide text-navy-800">{c}</td>
                  ))}
                </tr>
              </tfoot>
            </table>
          </div>
        ) : (
          <EmptyState icon="inbox" title="Tidak ada data"
            desc="Tidak ditemukan data pada rentang tanggal dan filter yang dipilih. Coba perluas rentang atau longgarkan filter." />
        )}
        <div className="no-print border-t border-slate-100 px-5 py-1">
          <DemoNote>Pratinjau laporan dihasilkan dari data demo fiktif. Gunakan tombol Cetak untuk tata letak resmi dengan kop institusi.</DemoNote>
        </div>

        {/* Blok tanda tangan — hanya tampil saat dicetak */}
        <div className="print-only mt-10 flex justify-end">
          <div className="text-center text-xs text-slate-800">
            <p>Manado, {fmtDate(todayISO())}</p>
            <p>Petugas Pendataan Barang Bukti,</p>
            <div style={{ height: 64 }} />
            <p className="font-bold underline">{user ? user.nama : '.....................'}</p>
            <p>Pangkat/NRP: ...........................</p>
          </div>
        </div>
      </Card>
    </div>
  );
}

/* ---------- Manajemen Pengguna ---------- */
function PenggunaPage() {
  const { data, user, addUser, updateUser, setUserStatus, deleteUser, toast } = useApp();
  const [q, setQ] = useState('');
  const [formOpen, setFormOpen] = useState(false);
  const [editing, setEditing] = useState<UserAkun | null>(null);
  const [delTarget, setDelTarget] = useState<UserAkun | null>(null);
  const [f, setF] = useState<any>({ username: '', nama: '', role: 'Petugas', status: 'Aktif' });
  const [errs, setErrs] = useState<any>({});

  const list = data.users.filter((u: UserAkun) =>
    (u.username + ' ' + u.nama).toLowerCase().includes(q.trim().toLowerCase()));

  function openAdd() {
    setEditing(null);
    setF({ username: '', nama: '', role: 'Petugas', status: 'Aktif' });
    setErrs({});
    setFormOpen(true);
  }
  function openEdit(u: UserAkun) {
    setEditing(u);
    setF({ username: u.username, nama: u.nama, role: u.role, status: u.status });
    setErrs({});
    setFormOpen(true);
  }
  function submit() {
    const e: any = {};
    if (!f.username.trim()) e.username = 'Nama pengguna wajib diisi.';
    else if (!/^[a-zA-Z0-9._-]+$/.test(f.username.trim())) e.username = 'Gunakan huruf, angka, titik, garis bawah, atau tanda hubung.';
    else if (data.users.some((u: UserAkun) => u.username.toLowerCase() === f.username.trim().toLowerCase() && (!editing || u.id !== editing.id)))
      e.username = 'Nama pengguna sudah digunakan.';
    if (!f.nama.trim()) e.nama = 'Nama tampilan wajib diisi.';
    if (!f.role) e.role = 'Pilih peran.';
    setErrs(e);
    if (Object.keys(e).length) { toast('error', 'Formulir belum lengkap', 'Periksa kembali isian yang ditandai merah.'); return; }
    if (editing) { updateUser(editing.id, f); toast('success', 'Pengguna diperbarui', 'Data akun ' + f.username + ' disimpan (demo).'); }
    else { const r = addUser(f); if (!r.ok) { toast('error', 'Gagal menambahkan', r.msg); return; } toast('success', 'Pengguna ditambahkan', 'Akun ' + f.username + ' dapat dipakai dengan kata sandi demo123.'); }
    setFormOpen(false);
  }
  function toggleStatus(u: UserAkun) {
    if (u.username === user.username) { toast('error', 'Tidak diizinkan', 'Anda tidak dapat menonaktifkan akun yang sedang digunakan.'); return; }
    const ns = u.status === 'Aktif' ? 'Nonaktif' : 'Aktif';
    setUserStatus(u.id, ns);
    toast(ns === 'Aktif' ? 'success' : 'info', 'Status pengguna diperbarui', '@' + u.username + ' kini berstatus ' + ns + ' (demo).');
  }
  function confirmDelete() {
    if (!delTarget) return;
    const r = deleteUser(delTarget.id);
    if (r.ok) toast('success', 'Pengguna dihapus', '@' + delTarget.username + ' dihapus dari data demo.');
    else toast('error', 'Gagal menghapus', r.msg);
    setDelTarget(null);
  }

  return (
    <div>
      <div className="flex items-start gap-3 rounded-xl border border-blue-100 bg-blue-50 px-4 py-3">
        <Icon name="info" size={16} className="mt-0.5 shrink-0 text-blue-600" />
        <p className="text-xs leading-relaxed text-blue-900">
          <span className="font-bold">Catatan keamanan:</span> pada demo ini, peran (Administrator/Petugas) hanya memengaruhi tampilan
          antarmuka — navigasi dan tombol. Pengamanan akses sesungguhnya memerlukan implementasi backend (misalnya sesi PHP + MySQL) dan tidak diklaim berjalan di sini.
        </p>
      </div>

      <div className="mt-4 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
        <SearchInput className="w-full sm:w-72" placeholder="Cari nama pengguna atau nama tampilan…" value={q} onChange={(e: any) => setQ(e.target.value)} />
        <Button icon="plus" onClick={openAdd}>Tambah Pengguna</Button>
      </div>

      <Card noPad className="mt-4">
        {list.length ? (
          <div className="overflow-x-auto">
            <table className="w-full min-w-[760px] text-left text-sm">
              <thead>
                <tr className="border-b border-slate-200 bg-slate-50/80 text-[11px] uppercase tracking-wide text-slate-500">
                  <th className="px-5 py-3 font-semibold">Nama Pengguna</th>
                  <th className="px-4 py-3 font-semibold">Nama Tampilan</th>
                  <th className="px-4 py-3 font-semibold">Peran</th>
                  <th className="px-4 py-3 font-semibold">Status</th>
                  <th className="px-4 py-3 font-semibold">Aktivitas Terakhir</th>
                  <th className="px-5 py-3 text-right font-semibold">Aksi</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-100">
                {list.map((u: UserAkun) => {
                  const self = u.username === user.username;
                  return (
                    <tr key={u.id} className="transition hover:bg-slate-50/70">
                      <td className="px-5 py-3.5">
                        <div className="flex items-center gap-3">
                          <Avatar nama={u.nama} />
                          <span className="text-xs font-bold text-navy-800">@{u.username}{self && <span className="ml-1 text-[10px] font-medium text-slate-400">(Anda)</span>}</span>
                        </div>
                      </td>
                      <td className="whitespace-nowrap px-4 py-3.5 text-slate-700">{u.nama}</td>
                      <td className="px-4 py-3.5"><Badge>{u.role}</Badge></td>
                      <td className="px-4 py-3.5"><Badge>{u.status}</Badge></td>
                      <td className="whitespace-nowrap px-4 py-3.5 text-xs tabular-nums text-slate-500">{u.aktivitasTerakhir === '-' ? 'Belum pernah' : fmtDateTime(u.aktivitasTerakhir)}</td>
                      <td className="px-5 py-3.5">
                        <div className="flex justify-end gap-1.5">
                          <IconBtn icon="pencil" title="Edit pengguna" onClick={() => openEdit(u)} />
                          <Button size="sm" variant="secondary" disabled={self} onClick={() => toggleStatus(u)}>
                            {u.status === 'Aktif' ? 'Nonaktifkan' : 'Aktifkan'}
                          </Button>
                          <IconBtn icon="trash-2" tone="danger" title="Hapus pengguna"
                            disabled={self || u.username === 'admin'}
                            onClick={() => setDelTarget(u)} />
                        </div>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        ) : (
          <EmptyState icon="users" title="Tidak ada pengguna yang cocok" desc="Ubah kata kunci pencarian atau tambahkan pengguna baru."
            action={<Button icon="plus" onClick={openAdd}>Tambah Pengguna</Button>} />
        )}
      </Card>

      <DemoNote>Kata sandi seluruh akun demo adalah demo123. Akun admin demo tidak dapat dihapus, dan Anda tidak dapat menonaktifkan akun sendiri.</DemoNote>

      <Modal open={formOpen} onClose={() => setFormOpen(false)} width="max-w-lg"
        title={editing ? 'Edit Pengguna' : 'Tambah Pengguna'}
        desc={editing ? 'Perbarui data akun pada demo.' : 'Buat akun demo baru dengan kata sandi demo123.'}
        footer={<Fragment>
          <Button variant="secondary" onClick={() => setFormOpen(false)}>Batal</Button>
          <Button icon="check" onClick={submit}>{editing ? 'Simpan Perubahan' : 'Simpan Pengguna'}</Button>
        </Fragment>}>
        <div className="grid gap-4">
          <Field label="Nama Pengguna (Username)" required error={errs.username}
            hint={editing ? 'Username tidak dapat diubah pada demo.' : undefined}>
            <Input value={f.username} disabled={!!editing} error={errs.username} onChange={(e: any) => setF((o: any) => ({ ...o, username: e.target.value }))} placeholder="cth. nama.pengguna" />
          </Field>
          <Field label="Nama Tampilan" required error={errs.nama}>
            <Input value={f.nama} error={errs.nama} onChange={(e: any) => setF((o: any) => ({ ...o, nama: e.target.value }))} placeholder="cth. IPTU Nama Lengkap" />
          </Field>
          <div className="grid gap-4 sm:grid-cols-2">
            <Field label="Peran" required error={errs.role}>
              <Select value={f.role} error={errs.role} onChange={(e: any) => setF((o: any) => ({ ...o, role: e.target.value }))}
                options={[['Administrator', 'Administrator'], ['Petugas', 'Petugas']]} />
            </Field>
            {editing ? (
              <Field label="Status" required>
                <Select value={f.status} onChange={(e: any) => setF((o: any) => ({ ...o, status: e.target.value }))}
                  options={[['Aktif', 'Aktif'], ['Nonaktif', 'Nonaktif']]} />
              </Field>
            ) : (
              <Field label="Kata Sandi (Demo)" hint="Seluruh akun demo menggunakan kata sandi: demo123">
                <Input value="demo123" readOnly disabled />
              </Field>
            )}
          </div>
        </div>
      </Modal>

      <ConfirmDialog open={!!delTarget} onClose={() => setDelTarget(null)} onConfirm={confirmDelete} title="Hapus Pengguna?" confirmLabel="Hapus">
        <p>Akun <span className="font-semibold text-navy-800">@{delTarget?.username}</span> akan dihapus dari penyimpanan demo dan tidak dapat dibatalkan.</p>
      </ConfirmDialog>
    </div>
  );
}

/* ---------- Pengaturan ---------- */
function PengaturanPage() {
  const { data, user, logout, resetDemo, toast } = useApp();
  const [resetOpen, setResetOpen] = useState(false);
  const size = fmtBytes((localStorage.getItem(STORE_KEY) || '').length);

  function exportJson() {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'siber-evidence-data-demo.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 800);
    toast('success', 'Ekspor berhasil', 'Seluruh data demo diunduh sebagai berkas JSON.');
  }

  return (
    <div className="grid gap-5 lg:grid-cols-2">
      <Card title="Informasi Aplikasi" desc="Identitas dan lingkup aplikasi demo.">
        <InfoGrid rows={[
          { l: 'Nama Aplikasi', v: 'SIBER EVIDENCE' },
          { l: 'Versi', v: '1.0.0 (Demo Kerja Praktik)' },
          { l: 'Pengelola', v: 'Subbid Siber, Ditreskrimsus Polda Sulawesi Utara' },
          { l: 'Penyimpanan Data', v: 'localStorage peramban (tanpa server)' },
          { l: 'Ukuran Data Tersimpan', v: size },
        ]} />
        <DemoNote>Aplikasi ini bukan sistem produksi dan tidak terhubung ke basis data maupun sistem Kepolisian mana pun.</DemoNote>
      </Card>

      <Card title="Akun Saat Ini" desc="Sesi pengguna demo yang sedang aktif.">
        <div className="flex items-center gap-4">
          <Avatar nama={user.nama} size="h-12 w-12 text-sm" />
          <div className="min-w-0 flex-1">
            <p className="truncate text-sm font-bold text-navy-800">{user.nama}</p>
            <p className="truncate text-xs text-slate-500">@{user.username}</p>
            <div className="mt-1"><Badge>{user.role}</Badge></div>
          </div>
          <Button variant="secondary" icon="log-out" onClick={() => { logout(); toast('info', 'Anda telah keluar', 'Sesi demo diakhiri.'); }}>Keluar</Button>
        </div>
      </Card>

      <Card title="Data Demo" desc="Kelola data contoh yang tersimpan di peramban.">
        <div className="flex flex-wrap gap-2">
          <Button variant="secondary" icon="rotate-ccw" onClick={() => setResetOpen(true)}>Muat Ulang Data Contoh</Button>
          <Button variant="secondary" icon="download" onClick={exportJson}>Ekspor Data (JSON)</Button>
        </div>
        <DemoNote>Menyimpan data di localStorage berarti mengosongkan data peramban akan menghapus seluruh perubahan Anda. Gunakan ekspor JSON sebagai cadangan.</DemoNote>
      </Card>

      <Card title="Panduan Singkat (Demo)" desc="Alur kerja yang dapat dicoba.">
        <ol className="list-decimal space-y-2 pl-4 text-xs leading-relaxed text-slate-600">
          <li>Masuk dengan akun <span className="font-semibold">admin / demo123</span> (Administrator) atau akun Petugas untuk melihat perbedaan peran.</li>
          <li>Tambahkan perkara pada <span className="font-semibold">Data Perkara</span>, lalu daftarkan barang buktinya.</li>
          <li>Catat perpindahan/peminjaman pada <span className="font-semibold">Riwayat Perpindahan</span> dan amati perubahan status otomatis.</li>
          <li>Buat laporan pada halaman <span className="font-semibold">Laporan</span>, lalu cetak atau ekspor CSV.</li>
        </ol>
      </Card>

      <Card className="lg:col-span-2" title="Integrasi Backend (Rencana)" desc="Struktur kode disiapkan agar mudah dihubungkan dengan backend PHP + MySQL.">
        <p className="text-xs leading-relaxed text-slate-600">
          Seluruh aksi CRUD terpusat pada provider aplikasi (bagian 5 pada kode). Untuk integrasi, ganti operasi
          <span className="font-semibold"> setData(...)</span> dengan pemanggilan adapter <span className="font-semibold">apiFetch(...)</span>
          ke endpoint berikut, lalu hidrasi state dari respons API:
        </p>
        <pre className="mt-3 overflow-x-auto rounded-lg bg-navy-900 p-4 text-[11px] leading-relaxed text-slate-300"><code>{`GET    /api/perkara                    -> daftar perkara
POST   /api/perkara                    -> tambah perkara
PUT    /api/perkara/{id}               -> perbarui perkara
DELETE /api/perkara/{id}               -> hapus perkara
GET    /api/barang-bukti               -> daftar barang bukti
POST   /api/barang-bukti               -> daftar barang bukti baru
PUT    /api/barang-bukti/{id}          -> perbarui barang bukti
DELETE /api/barang-bukti/{id}          -> hapus (arsip) barang bukti
GET    /api/riwayat?kode=BB-...        -> riwayat per barang
POST   /api/riwayat                    -> catat kejadian perpindahan/peminjaman
GET    /api/laporan/rekap?dari=&sampai -> data laporan`}</code></pre>
        <p className="mt-3 text-[11px] leading-relaxed text-slate-400">
          Struktur tabel minimum di MySQL: <span className="font-mono">perkara</span>, <span className="font-mono">barang_bukti</span>,
          <span className="font-mono"> riwayat_bukti</span>, dan <span className="font-mono">pengguna</span>. Riwayat bersifat append-only.
        </p>
      </Card>

      <Card className="lg:col-span-2" title="Disclaimer" desc="Lingkup dan batasan aplikasi.">
        <div className="flex items-start gap-3 rounded-lg border border-amber-200 bg-amber-50 px-4 py-3">
          <Icon name="alert-triangle" size={18} className="mt-0.5 shrink-0 text-amber-600" />
          <p className="text-xs leading-relaxed text-amber-800">
            SIBER EVIDENCE adalah aplikasi administratif pencatatan dan pemantauan barang bukti untuk keperluan Kerja Praktik.
            Aplikasi ini bukan sistem pengambilan keputusan penyidikan, portal pengaduan publik, maupun alat analisis forensik.
            Riwayat perpindahan yang dicatat tidak menegakkan integritas forensik atau kelayakan hukum secara mandiri.
          </p>
        </div>
      </Card>

      <ConfirmDialog open={resetOpen} onClose={() => setResetOpen(false)} danger={false} confirmLabel="Muat Ulang"
        title="Muat Ulang Data Demo?" onConfirm={() => { resetDemo(); setResetOpen(false); toast('success', 'Data demo dimuat ulang', 'Seluruh data dikembalikan ke kondisi awal contoh.'); }}>
        <p>Seluruh perubahan Anda (perkara, barang bukti, riwayat, pengguna) akan dihapus dan diganti dengan data contoh awal.</p>
      </ConfirmDialog>
    </div>
  );
}

/* ============================== 10. ROOT & MOUNT ============================== */

function AppRoot() {
  const hash = useHash();
  const { user } = useApp();
  const path = hash.replace(/^#/, '') || '/';
  if (!user) return <LoginPage />;
  if (path === '/login' || path === '/' || path === '') return <Redirect to="/dashboard" />;
  return <AppShell path={path} />;
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <AppProvider>
    <AppRoot />
  </AppProvider>
);
</script>
